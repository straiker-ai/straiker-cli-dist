<svg xmlns="http://www.w3.org/2000/svg" width="232" height="44" viewBox="0 0 232 44" role="img" aria-label="Straiker">
  <title>Straiker</title>
  <defs>
    <!-- The brand gradient: gold to rose, the same pair the CLI renders in the
         terminal. Both ends carry enough contrast to read on GitHub's light and
         dark summary backgrounds, so one asset serves both themes. -->
    <linearGradient id="s6r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB82A"/>
      <stop offset="1" stop-color="#FF449E"/>
    </linearGradient>
  </defs>

  <!-- Bolt -->
  <path d="M20 4 L9 25 h8 l-3 15 L27 19 h-8 l4 -15 Z" fill="url(#s6r)"/>

  <!-- Wordmark -->
  <text x="42" y="30"
        font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="22" font-weight="700" letter-spacing="4.5" fill="url(#s6r)">STRAIKER</text>
</svg>
