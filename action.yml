name: Straiker scan
description: Scan the MCP servers, model weights, or agent skills in this repository
author: Straiker AI

branding:
  icon: shield
  color: orange

inputs:
  kind:
    description: >-
      What to scan: mcp, model, or skill. One engine each, and they take
      different coordinates — an MCP server can be a directory, a repository, a
      package or a live URL; a model is a hub id, an Ollama ref, a weights file
      or a model directory; a skill is a directory, an archive or a repository.

      Defaults to mcp, so a workflow written before models and skills existed
      keeps working unchanged.
    required: false
    default: mcp
  pat:
    description: >-
      Straiker personal access token. Create one in the console under
      Settings → API keys and store it as a repository secret.
    required: true
  paths:
    description: >-
      What to scan, one per line. Defaults to the repository root.

      For kind: mcp each entry must be a directory that could be installed on
      its own — the scanner installs and launches the server from the root of
      what it receives, and does not search subdirectories for a manifest.

      For kind: skill each entry is a skill directory or an archive.

      For kind: model an entry may also be a coordinate rather than a path —
      hf:org/model-name or ollama:llama3:8b — which Straiker fetches itself.
    required: false
    default: '.'
  fail-on:
    description: >-
      Fail the job at this severity or above: critical, high, medium, or low.
      Leave empty to report findings without failing.
    required: false
    default: high
  intensity:
    description: >-
      Scan depth: quick, standard, or deep. APPLIES TO kind: mcp ONLY, and is
      not sent for the others — it maps to the AI-pass knobs that only the MCP
      scanner reads. The model scanner uses no LLM at all, and the skill
      scanner's only switch is whether its AI pass runs. Passing it to either
      is an error rather than a no-op, so this action drops it instead.
    required: false
    default: standard
  version:
    description: CLI version to install, e.g. v0.1.0. Defaults to the latest release.
    required: false
    default: ''
  profile:
    description: Straiker environment — prod, stage, or dev.
    required: false
    default: prod
  name:
    description: >-
      Name for the scanned artifact. This is the IDENTITY successive scans are
      compared against, so keeping it stable is what makes drift between runs
      visible — and changing it starts a fresh history. Two projects sharing a
      name within one tenant collide into a single artifact.

      Defaults to the repository, which is stable across runs and distinct from
      a local `straiker mcp scan ./path` of the same code — that derives its
      name from the directory, so the two no longer overwrite each other.

      Applied only when scanning a single path; with several, each keeps its own
      directory name so they stay separate artifacts.
    required: false
    default: ${{ github.repository }}
  exclude:
    description: Globs to leave out of the upload, one per line.
    required: false
    default: ''
  upload-artifact:
    description: Upload the report bundle as a workflow artifact.
    required: false
    default: 'true'
  artifact-name:
    description: Name for the uploaded artifact.
    required: false
    default: straiker-results

outputs:
  exit-code:
    description: 0 clean, 1 findings at or above the threshold, 2 a scan errored.
    value: ${{ steps.scan.outputs.exit-code }}
  results-dir:
    description: Directory holding the report bundle and index.json.
    value: straiker-results

runs:
  using: composite
  steps:
    - name: Install straiker
      shell: bash
      env:
        STRAIKER_VERSION: ${{ inputs.version }}
        # The runner's own bin directory is already on PATH and writable, which
        # avoids needing sudo on every runner image.
        STRAIKER_INSTALL: ${{ runner.temp }}/straiker-bin
      run: |
        curl -fsSL https://raw.githubusercontent.com/straiker-ai/straiker-cli-dist/main/install.sh | sh
        echo "${{ runner.temp }}/straiker-bin" >> "$GITHUB_PATH"

    - name: Scan
      id: scan
      shell: bash
      env:
        STRAIKER_PAT: ${{ inputs.pat }}
        STRAIKER_PROFILE: ${{ inputs.profile }}
        STRAIKER_KIND: ${{ inputs.kind }}
      run: |
        set -o pipefail

        kind="$(echo "$STRAIKER_KIND" | xargs)"
        case "$kind" in
          mcp|model|skill) ;;
          *) echo "::error::kind must be mcp, model, or skill (got '$kind')"; exit 1 ;;
        esac

        # Inputs arrive as newline-separated blocks. Blank lines and comments
        # are dropped so a YAML block can be commented without breaking.
        args=()
        while IFS= read -r p; do
          p="$(echo "$p" | xargs)"
          [ -z "$p" ] && continue
          case "$p" in \#*) continue ;; esac
          args+=("$p")
        done <<< "${{ inputs.paths }}"

        if [ ${#args[@]} -eq 0 ]; then
          echo "::error::no targets given"; exit 1
        fi

        # A coordinate is fetched by Straiker and is not expected on disk, so it
        # skips the checkout test below. The CLI validates which coordinates each
        # kind actually accepts — it holds the engine table — so this only sorts
        # "look for it locally" from "hand it over".
        is_coordinate() {
          case "$1" in
            hf:*|huggingface:*|ollama:*|npm:*|pypi:*|smithery:*|github:*|git@*|http://*|https://*) return 0 ;;
            *) return 1 ;;
          esac
        }

        uploads=0
        for p in "${args[@]}"; do
          if is_coordinate "$p"; then continue; fi
          uploads=$((uploads + 1))
          if [ ! -e "$p" ]; then
            echo "::error::not found in the checkout: $p"; exit 1
          fi
          # Only MCP requires a directory, and the reason is real: the scanner
          # installs and launches the server from the root of what it receives.
          # A model may be a single weights file and a skill may be an archive,
          # so requiring a directory there would reject valid targets.
          if [ "$kind" = "mcp" ] && [ ! -d "$p" ]; then
            echo "::error::kind: mcp needs a directory, and $p is not one"; exit 1
          fi
        done

        excludes=()
        while IFS= read -r e; do
          e="$(echo "$e" | xargs)"
          [ -z "$e" ] && continue
          excludes+=(--exclude "$e")
        done <<< "${{ inputs.exclude }}"

        failon=()
        [ -n "${{ inputs.fail-on }}" ] && failon=(--fail-on "${{ inputs.fail-on }}")

        # --name is ONE value for the whole invocation, so passing it alongside
        # several paths would fold them all into a single artifact and have them
        # supersede each other's verdicts. With more than one path, each keeps
        # its own directory name instead.
        #
        # Withheld for a coordinate too. On an upload the name IS the artifact's
        # identity and has to be stable; on a fetched coordinate it is only a
        # display label, and forcing the repository name onto hf:org/model would
        # label someone else's model with your repo.
        name=()
        if [ ${#args[@]} -eq 1 ] && [ $uploads -eq 1 ] && [ -n "${{ inputs.name }}" ]; then
          name=(--name "${{ inputs.name }}")
        fi

        # Dropped for model and skill rather than passed. Both refuse it — the
        # model scanner has no LLM to tune and the skill scanner's only switch is
        # --no-ai — so sending it would fail the job with a CLI error instead of
        # scanning. See the intensity input's description.
        intensity=()
        if [ "$kind" = "mcp" ] && [ -n "${{ inputs.intensity }}" ]; then
          intensity=(--intensity "${{ inputs.intensity }}")
        fi

        # The scan's exit code is the step's exit code, so a failing scan is a
        # red check with no extra wiring. It is captured first so the artifact
        # upload below still runs.
        set +e
        # No --no-color: Actions renders ANSI, and the CLI detects CI and turns
        # colour on while keeping its live cursor-driven view off. Set NO_COLOR
        # in the workflow env to opt out.
        straiker "$kind" scan "${args[@]}" \
          "${intensity[@]}" "${name[@]}" "${failon[@]}" "${excludes[@]}" \
          --summary "$GITHUB_STEP_SUMMARY" \
          --out straiker-results
        code=$?
        set -e

        echo "exit-code=$code" >> "$GITHUB_OUTPUT"

        case $code in
          0) echo "::notice::Straiker $kind scan passed" ;;
          1) echo "::error::Straiker found findings at or above ${{ inputs.fail-on }}" ;;
          2) echo "::error::A scan errored — the verdict is unknown, not clean" ;;
          3) echo "::error::Straiker CLI or authentication failure" ;;
          *) echo "::error::Straiker exited $code" ;;
        esac
        exit $code

    # always(): the report is most wanted precisely when the scan just failed.
    - name: Upload report bundle
      if: always() && inputs.upload-artifact == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: straiker-results/
        if-no-files-found: warn
